    <path d="M760 120 L865 300 L670 300 Z" fill="#1d2e4d"/>
    <path d="M720 130 L761 290 L600 290 Z" fill="#183057" opacity="0.9"/>
    <path d="M857 302 H602 L615 338 H844 Z" fill="#f2d995"/>
