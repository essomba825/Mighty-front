    <path d="M1185 448 C1203 442, 1210 420, 1195 408" fill="none" stroke="#d0a95d" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g opacity="0.22">
    <circle cx="1380" cy="420" r="180" fill="#fff"/>
    <circle cx="1260" cy="520" r="120" fill="#fff"/>
